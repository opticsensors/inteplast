server {
  listen 80;

  # PDF.js uses a module worker; browsers reject it as application/octet-stream.
  location ~ \.mjs$ {
    root /usr/share/nginx/html;
    types { application/javascript mjs; }
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Built files carry a content hash in their name: cache them for good, and never
  # answer a missing one with index.html. An old tab asking for a chunk of a previous
  # build gets a 404, which the app turns into one reload, instead of HTML as code.
  location /assets/ {
    root /usr/share/nginx/html;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The page itself is always revalidated, so a rebuild reaches open browsers.
  location / {
    root /usr/share/nginx/html;
    index index.html index.htm;
    try_files $uri /index.html =404;
    add_header Cache-Control "no-cache";
  }

  include /etc/nginx/extra-conf.d/*.conf;
}
